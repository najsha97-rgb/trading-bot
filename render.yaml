services:
  - type: web
    name: tg-ai-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
